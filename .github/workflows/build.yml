# Every push to main: test, then build and push ghcr.io/kthaisociety/landingpage-frontend:sha-<7>.
# release.yml waits for this workflow's run of a release commit before tagging X.Y.Z: the two stay
# separate files.
name: build

on:
  push:
    branches: [main]

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  build:
    needs: test
    uses: kthaisociety/workflows/.github/workflows/build.yml@v0.2.0
    permissions:
      contents: read
      packages: write

