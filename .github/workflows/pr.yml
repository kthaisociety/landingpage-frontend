# Checks on every PR. Both jobs are required checks on main.
name: pr

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions: {}

jobs:
  # PRs are squash-merged, so the title becomes the commit release-please reads.
  title:
    uses: kthaisociety/workflows/.github/workflows/semantic-pr.yml@v0.2.0
    permissions:
      pull-requests: read

  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build

